<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>CRM · Painel Voluta</title>
<link rel="stylesheet" href="/css/site.css">
<style>
  body { background: #F6F5F3; }
  .inv { max-width: 1400px; margin: 0 auto; padding: 28px 24px 64px; }
  .inv__topo { display: flex; flex-wrap: wrap; gap: 12px 24px; align-items: center; justify-content: space-between; margin-bottom: 18px; }
  .inv__topo h1 { font-family: var(--titulo); text-transform: uppercase; letter-spacing: .06em; font-size: 16px; font-weight: 500; color: var(--vinho); margin: 0; }
  .inv__topo p { margin: 2px 0 0; font-size: 12px; color: var(--cinza); }
  .inv__acoes { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
  .bt { font-family: var(--titulo); text-transform: uppercase; letter-spacing: .06em; font-size: 11px; font-weight: 500; text-decoration: none; padding: 9px 14px; border: 1px solid var(--vinho); color: var(--vinho); background: #fff; cursor: pointer; display: inline-block; }
  .bt--prim { background: var(--vinho); color: #fff; }
  .bt--peq { padding: 6px 12px; font-size: 10.5px; }
  .bt--perigo { border-color: #A3283A; color: #A3283A; }
  .bt[disabled] { opacity: .5; cursor: default; }

  .abas { display: flex; gap: 2px; flex-wrap: wrap; border-bottom: 1px solid var(--linha); margin-bottom: 18px; }
  .abas button { all: unset; cursor: pointer; font-family: var(--titulo); text-transform: uppercase; letter-spacing: .08em; font-size: 11.5px; font-weight: 500; color: var(--cinza); padding: 11px 16px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
  .abas button[aria-selected="true"] { color: var(--vinho); border-bottom-color: var(--vinho); }
  .abas button:focus-visible { outline: 2px solid var(--mostarda); }

  .filtros { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  .filtros input, .filtros select { font: 300 13px var(--texto); padding: 8px 10px; border: 1px solid var(--linha); background: #fff; color: var(--tinta); }
  .filtros input[type=search] { min-width: 220px; flex: 1; max-width: 360px; }
  .filtros label { font-size: 12px; color: var(--cinza); display: flex; align-items: center; gap: 6px; }
  .filtros .dir { margin-left: auto; display: flex; gap: 8px; align-items: center; }
  .cont { font-size: 12px; color: var(--cinza); }

  /* A tabela rola dentro da caixa: assim o cabeçalho fica congelado no topo e os totais no rodapé */
  .rolagem { overflow: auto; max-height: calc(100vh - 150px); background: #fff; border: 1px solid #ECE8E4; }
  .graf .rolagem { max-height: 360px; }
  #t-tipos .rolagem { max-height: none; }
  .tabela { width: 100%; border-collapse: collapse; font-size: 13px; }
  .tabela th { position: sticky; top: 0; z-index: 2; background: #fff; box-shadow: 0 1px 0 var(--mostarda); text-align: left; font-family: var(--titulo); text-transform: uppercase; letter-spacing: .06em; font-size: 10.5px; font-weight: 500; color: var(--vinho); padding: 11px 12px; border-bottom: 1px solid var(--mostarda); white-space: nowrap; }
  .tabela th.n, .tabela td.n { text-align: right; }
  .tabela th button { all: unset; cursor: pointer; }
  .tabela th[aria-sort="ascending"] button::after { content: " ↑"; }
  .tabela th[aria-sort="descending"] button::after { content: " ↓"; }
  .tabela td { padding: 7px 12px; border-bottom: 1px solid #F0ECE8; vertical-align: middle; white-space: nowrap; }
  .tabela td.larga { white-space: normal; min-width: 220px; }
  .tabela tbody tr { cursor: pointer; }
  .tabela tbody tr:hover td { background: #FBFAF8; }
  .tabela tfoot td { position: sticky; bottom: 0; z-index: 1; font-weight: 500; border-top: 1px solid var(--mostarda); border-bottom: 0; background: #FCFBF9; box-shadow: 0 -1px 0 var(--mostarda); }
  .tabela img { width: 40px; height: 40px; max-width: none; object-fit: cover; background: #F4F4F4; display: block; }
  .tabela .sf { width: 40px; height: 40px; background: #F4F2EF; }
  .tabela td.td-ed { padding: 4px 6px; cursor: default; }
  .cel { width: 92px; box-sizing: border-box; font: 300 13px var(--texto); font-variant-numeric: tabular-nums; text-align: right; padding: 6px 8px;
    border: 1px solid #EAE3DC; background: #FDFBF8; color: var(--tinta); }
  .cel:hover { border-color: #D9CFC4; background: #fff; }
  .cel:focus { outline: 2px solid var(--mostarda); outline-offset: -1px; background: #fff; border-color: transparent; }
  .num { font-variant-numeric: tabular-nums; }
  .cinza { color: var(--cinza); }
  .neg { color: #A3283A; }
  .st { display: inline-block; font-size: 11px; padding: 2px 9px; border-radius: 99px; }
  .st--disponivel { background: #E6F2EA; color: #1F6A43; }
  .st--vendido { background: #F3E6E9; color: var(--vinho); }
  .st--reservado { background: #F6EED6; color: #7A5D12; }
  .site { font-size: 10.5px; color: var(--cinza); margin-left: 6px; }
  .aviso { background: #fff; border: 1px solid #ECE8E4; padding: 40px 24px; text-align: center; font-size: 14px; }
  .aviso p { margin: 0 0 16px; }
  .aviso-crm { background: #FBF6E8; border: 1px solid #EFE2B8; color: #6B5313; padding: 10px 14px; font-size: 12.5px; margin-bottom: 14px; }
  .aviso-crm--ok { background: #EEF6F0; border-color: #CFE5D6; color: #1F5A3A; }
  .aviso-crm--erro { background: #FBEDEF; border-color: #EBC6CC; color: #7C1F2E; }

  /* Painel */
  .kpis { display: grid; grid-template-columns: repeat(auto-fill, minmax(190px, 1fr)); gap: 12px; margin-bottom: 18px; }
  .kpi { background: #fff; border: 1px solid #ECE8E4; padding: 14px 16px; }
  .kpi__r { font-family: var(--titulo); text-transform: uppercase; letter-spacing: .08em; font-size: 10.5px; color: var(--cinza); margin: 0 0 6px; }
  .kpi__v { font-size: 22px; font-weight: 400; color: var(--tinta); margin: 0; font-variant-numeric: tabular-nums; line-height: 1.2; }
  .kpi__s { font-size: 11.5px; color: var(--cinza); margin: 4px 0 0; }
  .sec { font-family: var(--titulo); text-transform: uppercase; letter-spacing: .1em; font-size: 11px; font-weight: 500; color: var(--vinho); margin: 26px 0 10px; }
  .graficos { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
  @media (max-width: 900px) { .graficos { grid-template-columns: 1fr; } }
  .graf { background: #fff; border: 1px solid #ECE8E4; padding: 16px 16px 10px; min-width: 0; }
  .graf--largo { grid-column: 1 / -1; }
  .graf h3 { font-family: var(--texto); font-size: 13.5px; font-weight: 500; margin: 0 0 2px; color: var(--tinta); text-transform: none; letter-spacing: 0; }
  .graf .sub { font-size: 11.5px; color: var(--cinza); margin: 0 0 10px; }
  .graf .area { position: relative; height: 260px; }
  .graf details { margin-top: 8px; font-size: 12px; }
  .graf summary { cursor: pointer; color: var(--cinza); }
  .graf details table { margin-top: 6px; font-size: 12px; }
  .graf details td, .graf details th { padding: 4px 10px; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 4px 0 14px; align-items: center; }
  .chip { display: inline-flex; align-items: center; gap: 7px; font-size: 12px; padding: 5px 11px; border: 1px solid var(--linha); border-radius: 99px; background: #fff; cursor: pointer; user-select: none; }
  .chip input { position: absolute; opacity: 0; pointer-events: none; }
  .chip i { width: 9px; height: 9px; border-radius: 2px; background: var(--c); opacity: .3; }
  .chip:has(input:checked) { border-color: var(--tinta); background: #FBFAF8; }
  .chip:has(input:checked) i { opacity: 1; }
  .chip:has(input:focus-visible) { outline: 2px solid var(--mostarda); }
  .chips .lnk { all: unset; cursor: pointer; font-size: 12px; color: var(--burle); margin-left: 6px; }
  .tipos { display: grid; grid-template-columns: minmax(0, 300px) minmax(0, 1fr); gap: 24px; align-items: center; }
  @media (max-width: 760px) { .tipos { grid-template-columns: 1fr; } }
  .area--pizza { height: 260px; }
  .sw { display: inline-block; width: 10px; height: 10px; border-radius: 2px; margin-right: 8px; vertical-align: -1px; }
  .total-tipos { font-size: 22px; font-variant-numeric: tabular-nums; margin: 0 0 4px; }
  /* Montar painel */
  .montar { display: grid; grid-template-columns: 250px minmax(0, 1fr); gap: 16px; align-items: start; }
  @media (max-width: 860px) { .montar { grid-template-columns: 1fr; } }
  .dados { background: #fff; border: 1px solid #ECE8E4; padding: 14px; position: sticky; top: 12px; max-height: calc(100vh - 24px); overflow: auto; }
  @media (max-width: 860px) { .dados { position: static; max-height: none; } }
  .dados__ajuda { font-size: 11.5px; color: var(--cinza); margin: 0 0 10px; line-height: 1.5; }
  .dados h4 { font-family: var(--titulo); text-transform: uppercase; letter-spacing: .08em; font-size: 10px; font-weight: 500; color: var(--vinho); margin: 10px 0 5px; }
  .dados__lista { display: flex; flex-wrap: wrap; gap: 4px; }
  .dado { font-size: 11.5px; padding: 3px 9px; border-radius: 99px; cursor: grab; user-select: none; border: 1px solid; }
  .dado:active { cursor: grabbing; }
  .dado--valor { background: #F7EEF0; border-color: #E8D3D8; color: var(--vinho); }
  .dado--grupo { background: #EEF3FA; border-color: #D3DFEE; color: #1F4E8A; }
  .quadro { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; align-items: start; }
  @media (max-width: 1100px) { .quadro { grid-template-columns: 1fr; } }
  .wg { background: #fff; border: 1px solid #ECE8E4; padding: 12px 14px 12px; min-width: 0; }
  .wg--2 { grid-column: 1 / -1; }
  @media (max-width: 1100px) { .wg__btn[data-acao="largura"] { display: none; } }
  .wg__topo { display: flex; align-items: center; gap: 8px; }
  .wg__alca { cursor: grab; color: #B5ACA4; font-size: 16px; padding: 2px 2px; user-select: none; }
  .wg__tit { flex: 1; min-width: 0; font: 500 13.5px var(--texto); color: var(--tinta); border: 1px solid transparent; padding: 4px 6px; background: none; }
  .wg__tit:hover { border-color: var(--linha); }
  .wg__tit:focus { outline: 2px solid var(--mostarda); outline-offset: -1px; }
  .wg__btn { all: unset; cursor: pointer; font-size: 11px; color: var(--cinza); padding: 4px 6px; white-space: nowrap; }
  .wg__btn:hover, .wg__btn:focus-visible { color: var(--vinho); outline: 1px solid var(--linha); }
  .wg__btn--perigo { color: #A3283A; font-weight: 500; }
  .wg__tipos { display: flex; flex-wrap: wrap; gap: 2px; margin: 6px 0 8px; }
  .wg__tipos button { all: unset; cursor: pointer; font-size: 11px; padding: 3px 9px; border-radius: 4px; color: var(--cinza); }
  .wg__tipos button[aria-pressed="true"] { background: var(--vinho); color: #fff; }
  .wg__tipos button:disabled { opacity: .35; cursor: default; }
  .wg__tipos button:focus-visible { outline: 2px solid var(--mostarda); }
  .wg__slots { display: grid; gap: 6px; margin-bottom: 6px; }
  .slot { display: flex; flex-wrap: wrap; align-items: center; gap: 5px; padding: 6px 8px; border: 1px dashed #E3DCD5; background: #FCFBF9; min-height: 32px; }
  .slot__r { font-size: 10.5px; text-transform: uppercase; letter-spacing: .06em; color: var(--cinza); margin-right: 4px; }
  .pilula { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; padding: 2px 4px 2px 10px; border-radius: 99px; }
  .pilula button { all: unset; cursor: pointer; font-size: 10px; padding: 2px 5px; border-radius: 99px; }
  .pilula button:hover, .pilula button:focus-visible { background: rgba(0,0,0,.08); }
  .pilula--valor { background: #F7EEF0; color: var(--vinho); }
  .pilula--grupo { background: #EEF3FA; color: #1F4E8A; }
  .mais { font: 300 12px var(--texto); border: 0; background: none; color: var(--burle); cursor: pointer; padding: 2px; max-width: 120px; }
  .wg__aviso { font-size: 11.5px; color: #8A6A14; margin: 0 0 6px; min-height: 0; }
  .wg__aviso:empty { display: none; }
  .wg__aviso--forte { color: #A3283A; }
  .wg__nums { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 12px; padding: 8px 2px; }
  .wg details { margin-top: 6px; font-size: 12px; }
  .wg summary { cursor: pointer; color: var(--cinza); }
  .nova { border: 2px dashed #DDD3C9; color: var(--cinza); font-size: 13px; text-align: center; padding: 34px 16px; background: rgba(255,255,255,.5); }
  .arrastando .nova, .arrastando .wg { transition: box-shadow .1s; }
  .arrastando .wg { box-shadow: 0 0 0 1px #E8DCC0; }
  .alvo { box-shadow: 0 0 0 2px var(--mostarda) !important; background: #FFFCF4; }
  .slot--alvo { border-color: var(--mostarda); border-style: solid; background: #FFF8E6; }
  .lin-grupo td { font-weight: 500; background: #FBFAF8; }
  .lin-sub td { color: var(--cinza); font-size: 12.5px; padding-top: 5px; padding-bottom: 5px; }
  .lin-sub td:first-child { padding-left: 26px; white-space: normal; }
  .cel--saldo { width: 150px; font-size: 20px; text-align: left; padding: 4px 8px; }
  .cel--txt { width: 100%; min-width: 140px; text-align: left; }
  .ok { all: unset; cursor: pointer; width: 26px; height: 26px; border-radius: 50%; border: 1px solid var(--linha); display: inline-flex; align-items: center; justify-content: center; font-size: 12px; color: #B5ACA4; background: #fff; }
  .ok:hover, .ok:focus-visible { border-color: #1F6A43; color: #1F6A43; outline: none; box-shadow: 0 0 0 2px #E6F2EA; }
  .ok--feito { background: #1F6A43; border-color: #1F6A43; color: #fff; }
  .lin-paga td { color: #A39C94; text-decoration: line-through; text-decoration-color: #D5CCC3; }
  .lin-paga td:last-child { text-decoration: none; }
  .st--atraso { background: #FBEDEF; color: #A3283A; font-size: 10px; padding: 1px 7px; margin-left: 4px; }
  tr[data-mes] { cursor: pointer; }
  tr.lin-sel td { background: #FFF8E6 !important; box-shadow: inset 0 1px 0 var(--mostarda), inset 0 -1px 0 var(--mostarda); }
  .lin-fixo td { background: #FCFBF9; }
  .vazio--alvo { height: 120px; border: 1px dashed #E3DCD5; }
  .vazio { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--cinza); font-size: 13px; }

  /* Formulário */
  dialog { border: 0; padding: 0; width: min(720px, 94vw); max-height: 92vh; box-shadow: 0 20px 60px rgba(48,10,21,.25); }
  dialog::backdrop { background: rgba(30,20,22,.45); }
  .form { padding: 22px 24px 20px; }
  .form h2 { font-family: var(--titulo); text-transform: uppercase; letter-spacing: .08em; font-size: 14px; font-weight: 500; color: var(--vinho); margin: 0 0 16px; }
  .campos { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px 14px; }
  @media (max-width: 620px) { .campos { grid-template-columns: 1fr 1fr; } }
  .campo { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .campo--2 { grid-column: span 2; }
  .campo--3 { grid-column: 1 / -1; }
  .campo label { font-size: 11.5px; color: var(--cinza); }
  .campo input, .campo select, .campo textarea { font: 300 13.5px var(--texto); padding: 8px 10px; border: 1px solid var(--linha); background: #fff; color: var(--tinta); width: 100%; box-sizing: border-box; }
  .campo textarea { min-height: 60px; resize: vertical; }
  .campo .atalho { font-size: 11px; color: var(--burle); background: none; border: 0; padding: 0; cursor: pointer; text-align: left; }
  .resumo { display: flex; flex-wrap: wrap; gap: 6px 22px; background: #FBFAF8; border: 1px solid #F0ECE8; padding: 10px 14px; margin: 16px 0 0; font-size: 12.5px; }
  .resumo b { font-weight: 500; }
  .form__pe { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; margin-top: 18px; }
  .form__pe > div { display: flex; gap: 10px; flex-wrap: wrap; }
  .form__msg { font-size: 12.5px; margin-top: 10px; }
  .lista-compras { margin: 14px 0 0; font-size: 12.5px; }
  .lista-compras li { margin-bottom: 4px; }
  .oculto { display: none !important; }
  .lk { color: var(--burle); text-decoration: none; }
  .lk:hover { text-decoration: underline; }
  .campo__r { font-size: 11.5px; color: var(--cinza); }
  .foto-peca__linha { display: flex; flex-wrap: wrap; gap: 14px; align-items: center; }
  .foto-peca__prev img, .foto-peca__prev .sf { width: 96px; height: 96px; object-fit: cover; display: block; background: #F4F2EF; }
  .foto-peca__acoes { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; flex: 1; min-width: 200px; }
  .foto-peca__acoes p { flex-basis: 100%; }
  .foto-peca label.bt { font-size: 10.5px; color: var(--vinho); }
  .foto-peca__flag { font-size: 13px; white-space: nowrap; display: flex; align-items: center; gap: 6px; cursor: pointer; }
  .visually-hidden { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }
</style>
</head>
<body>
<main class="inv">
  <div class="inv__topo">
    <div>
      <h1>CRM · Voluta</h1>
      <p>Custos, vendas e resultados. Os dados ficam no repositório privado; o status das peças segue o site.</p>
    </div>
    <div class="inv__acoes">
      <a class="bt" href="/admin/">Inventário do site</a>
    </div>
  </div>
  <div id="app"><div class="aviso"><p>Carregando o CRM…</p></div></div>
</main>
<dialog id="dlg"><div class="form" id="dlg-corpo"></div></dialog>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
<script src="/admin/crm/crm.js"></script>
<script src="/admin/publicar.js" defer></script>
</body>
</html>
