# Painel de cadastro da Voluta (Decap CMS)
# Acesse em volutagaleria.com.br/admin e entre com sua conta do GitHub.
backend:
  name: github
  repo: andremenezes-volutagaleria/voluta-site
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth

locale: pt
media_folder: static/uploads
public_folder: /uploads
publish_mode: simple

collections:
  - name: pecas
    label: Peças do acervo
    label_singular: Peça
    folder: content/pecas
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{designer}}-{{titulo}}"
    summary: "{{designer}} · {{titulo}} · {{status}}"
    view_filters:
      - { label: "Disponíveis", field: status, pattern: "disponivel" }
      - { label: "Vendidas", field: status, pattern: "vendido" }
      - { label: "Ocultas", field: status, pattern: "oculto" }
      - { label: "Em destaque", field: destaque, pattern: true }
    view_groups:
      - { label: "Tipo de peça", field: categoria }
      - { label: "Designer", field: designer }
      - { label: "Situação", field: status }
    sortable_fields: ["ordem", "designer", "titulo"]
    fields:
      - { name: titulo, label: Nome da peça, widget: string }
      - { name: designer, label: Designer ou fabricante, widget: string, hint: "Escreva igual às outras peças (ex.: Sérgio Rodrigues) para agrupar certo." }
      - { name: ano, label: Ano ou década, widget: string, required: false, hint: "ex.: 1973 ou déc. 1960" }
      - name: categoria
        label: Tipo de peça
        widget: select
        options: ["Poltronas", "Cadeiras", "Sofás", "Mesas de centro", "Mesas laterais", "Mesas de jantar", "Bancos", "Buffets", "Escrivaninhas"]
      - name: status
        label: Situação
        widget: select
        default: disponivel
        options:
          - { label: "Disponível", value: disponivel }
          - { label: "Vendido", value: vendido }
          - { label: "Oculto (não aparece no site)", value: oculto }
      - { name: preco, label: "Preço à vista (R$)", widget: number, value_type: int, required: false, hint: "Deixe vazio para mostrar 'Preço sob consulta'." }
      - { name: preco_obs, label: Observação do preço, widget: string, required: false, hint: "ex.: o par, cada unidade" }
      - { name: parcelamento, label: Parcelamento, widget: string, default: "em até 12x", required: false }
      - { name: dimensoes, label: Dimensões, widget: string, required: false, hint: "ex.: L 86 × P 75 × A 70 cm" }
      - { name: materiais, label: Materiais, widget: string, required: false }
      - { name: descricao, label: Descrição, widget: text }
      - { name: imagens, label: Fotos (a primeira é a capa), widget: list, field: { name: imagem, label: Foto, widget: image } }
      - { name: data, label: Data de entrada no acervo, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, hint: "Define a ordem em Chegaram agora e Mais recentes." }
      - { name: codigo, label: Código interno (VLT), widget: string, required: false }
      - { name: destaque, label: Mostrar em Destaques na página inicial, widget: boolean, default: false }
      - { name: ordem, label: Ordem no acervo, widget: number, value_type: int, default: 100, hint: "Números menores aparecem primeiro." }
      - { name: url_antiga, label: Endereço antigo (Artlogic), widget: hidden, required: false }
      - { name: categoria_antiga, label: Categoria antiga, widget: hidden, required: false }

  - name: config
    label: Textos e contatos
    editor: { preview: false }
    files:
      - name: site
        label: Configurações do site
        file: content/site.json
        format: json
        fields:
          - name: carrossel
            label: Carrossel da página inicial
            label_singular: Foto
            widget: list
            summary: "{{fields.descricao_foto}}"
            hint: "Fotos horizontais (paisagem), de 2000px de largura ou mais. A ordem aqui é a ordem no site. Arraste para reordenar."
            fields:
              - { name: foto, label: Foto horizontal, widget: image }
              - { name: descricao_foto, label: "Descrição da foto (para Google e acessibilidade)", widget: string, required: false }
              - { name: titulo, label: Título (opcional), widget: string, required: false }
              - { name: texto, label: Frase curta (opcional), widget: string, required: false }
              - { name: link, label: "Link (opcional), ex.: /restauro/ ou /acervo/percival-lafer-poltrona-mp-71/", widget: string, required: false }
              - { name: link_texto, label: "Texto do link (opcional), ex.: Conheça o restauro", widget: string, required: false }
          - { name: nome, label: Nome, widget: string }
          - { name: url, label: Endereço do site, widget: string }
          - { name: descricao, label: Descrição para o Google, widget: text }
          - { name: cidade, label: Cidade, widget: string }
          - { name: whatsapp, label: "WhatsApp (só números, com 55)", widget: string }
          - { name: whatsapp_exibicao, label: WhatsApp como aparece no site, widget: string }
          - { name: email, label: E-mail, widget: string }
          - { name: instagram, label: Instagram (sem @), widget: string }
          - { name: logo, label: Logo, widget: image }
          - { name: imagem_sobre, label: Foto da página Sobre, widget: image }
          - { name: ga4_id, label: "Google Analytics (G-XXXX)", widget: string, required: false }
          - { name: meta_pixel_id, label: Pixel da Meta, widget: string, required: false }
          - { name: categorias, label: Tipos de peça (ordem do filtro), widget: list }
          - { name: designers, label: Designers, widget: list, summary: "{{fields.nome}}", fields: [ { name: nome, label: Nome, widget: string }, { name: info, label: "Nacionalidade e datas", widget: string, required: false } ] }
          - { name: sobre, label: Texto da página Sobre, widget: markdown }
          - { name: restauro, label: Texto da página Restauro, widget: markdown }
          - { name: devolucao, label: Política de devolução, widget: markdown }
