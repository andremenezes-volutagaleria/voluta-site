<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Painel · Voluta</title>
</head>
<body>
  <script src="/admin/editar/fotos.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="/admin/consertar.js"></script>
  <script src="/admin/editar/preview.js"></script>
  <script src="/admin/editar/fotos-multiplas.js"></script>
  <script>
    CMS.registerEventListener({ name: "preSave", handler: ({ entry }) => {
      const slug = entry.get("slug"), dados = entry.get("data").toJS();
      if (entry.get("collection") !== "pecas" || !slug) return entry.get("data");
      const certo = window.voltaFichaCerta(slug + ".json", dados);
      let d = entry.get("data");
      if (certo === dados) return d;
      if (certo.codigo !== dados.codigo) d = d.set("codigo", certo.codigo);
      if (d.get("imagens") && JSON.stringify(certo.imagens) !== JSON.stringify(dados.imagens)) d = d.set("imagens", d.get("imagens").map((u, i) => certo.imagens[i]));
      return d;
    } });
  </script>
  <script>
    // A tela de lista do editor foi substituída pela tabela em /admin.
    // Sempre que o editor (ou o botão "voltar" do navegador) cair numa lista, vai para a tabela.
    (function () {
      // Lembra para onde a pessoa queria ir (ex.: Exposições, Diário, uma peça). Se o editor pedir login,
      // o GitLab devolve para /admin/editar/ sem esse destino; aí voltamos para ele em vez de cair na tabela.
      var CHAVE = "voluta-destino";
      var guardar = function () {
        var h = location.hash || "";
        if (/^#\/collections\/(?!pecas\/?(\?.*)?$)./.test(h)) { try { sessionStorage.setItem(CHAVE, h); } catch (e) {} }
      };
      guardar();   // só ao abrir a página (os cliques dentro do editor não mudam o destino)
      var visto = 0;
      var paraTabela = function () {
        var h = location.hash || "";
        // Chegou no destino já logado: esquece o destino (para não voltar a ele depois de salvar e sair)
        try {
          if (h && h === sessionStorage.getItem(CHAVE) && localStorage.getItem("decap-cms-user") && !sessionStorage.getItem("decap-cms-pkce-verifier-code")) {
            if (++visto >= 2) sessionStorage.removeItem(CHAVE);
          } else visto = 0;
        } catch (e) {}
        if (h === "" || h === "#" || h === "#/" || /^#\/collections\/pecas\/?(\?.*)?$/.test(h) || /^#\/search\//.test(h)) {
          if (document.querySelector("[class*='AuthenticationPage'], [class*='LoginButton']")) return; // ainda no login
          if (/[?&](code|state)=/.test(location.search)) return; // voltando do login do GitLab: espera o editor terminar
          try {
            if (sessionStorage.getItem("decap-cms-pkce-verifier-code")) return;   // login com o GitLab em andamento
            if (!localStorage.getItem("decap-cms-user")) return;                  // ainda não entrou: deixa a tela de login
          } catch (e) {}
          var destino = null; try { destino = sessionStorage.getItem(CHAVE); sessionStorage.removeItem(CHAVE); } catch (e) {}
          var usado = 0; try { usado = +sessionStorage.getItem(CHAVE + "-em") || 0; } catch (e) {}
          if (destino && destino !== h && Date.now() - usado > 15000) {
            try { sessionStorage.setItem(CHAVE + "-em", String(Date.now())); } catch (e) {}   // evita ficar em círculo
            location.replace("/admin/editar/" + destino); return;
          }
          location.replace("/admin/");
        }
      };
      window.addEventListener("hashchange", paraTabela);
      setInterval(paraTabela, 800); // cobre o redirecionamento feito pelo próprio editor após o login
    })();
  </script>
  <div style="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9998;background:#FFF8E6;color:#5A4300;border:1px solid #E8D39A;font:400 12px/1.4 system-ui,sans-serif;padding:8px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.08);pointer-events:none;max-width:min(560px,80vw);text-align:center">Aqui, <b>Publicar</b> só salva a alteração. O site é atualizado pelo botão <b>Publicar site</b>, na tabela.</div>
  <a href="/admin/" style="position:fixed;left:16px;bottom:16px;z-index:9999;background:#300A15;color:#fff;font:500 12px/1 system-ui,sans-serif;letter-spacing:.04em;text-decoration:none;padding:11px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.18)">▦ Voltar para a tabela</a>
</body>
</html>
