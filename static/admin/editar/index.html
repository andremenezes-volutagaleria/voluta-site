<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Painel · Voluta</title>
</head>
<body>
  <script src="/admin/editar/fotos.js"></script>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  <script src="/admin/editar/preview.js"></script>
  <script>
    // A tela de lista do editor foi substituída pela tabela em /admin.
    // Sempre que o editor (ou o botão "voltar" do navegador) cair numa lista, vai para a tabela.
    (function () {
      var paraTabela = function () {
        var h = location.hash || "";
        if (h === "" || h === "#" || h === "#/" || /^#\/collections\/[^/]+\/?(\?.*)?$/.test(h) || /^#\/search\//.test(h)) {
          if (document.querySelector("[class*='AuthenticationPage'], [class*='LoginButton']")) return; // ainda no login
          location.replace("/admin/");
        }
      };
      window.addEventListener("hashchange", paraTabela);
      setInterval(paraTabela, 800); // cobre o redirecionamento feito pelo próprio editor após o login
    })();
  </script>
  <div style="position:fixed;left:50%;bottom:16px;transform:translateX(-50%);z-index:9998;background:#FFF8E6;color:#5A4300;border:1px solid #E8D39A;font:400 12px/1.4 system-ui,sans-serif;padding:8px 14px;border-radius:8px;box-shadow:0 4px 14px rgba(0,0,0,.08);pointer-events:none;max-width:min(560px,80vw);text-align:center">Aqui, <b>Publicar</b> só salva a alteração. O site é atualizado pelo botão <b>Publicar site</b>, na tabela.</div>
  <a href="/admin/" style="position:fixed;left:16px;bottom:16px;z-index:9999;background:#300A15;color:#fff;font:500 12px/1 system-ui,sans-serif;letter-spacing:.04em;text-decoration:none;padding:11px 16px;border-radius:999px;box-shadow:0 4px 14px rgba(0,0,0,.18)">▦ Voltar para a tabela</a>
</body>
</html>
