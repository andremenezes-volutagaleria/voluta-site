# Painel de cadastro da Voluta (Decap CMS)
# Editor do painel (a tabela fica em /admin). Entre com sua conta do GitHub.
backend:
  name: github
  repo: andremenezes-volutagaleria/voluta-site
  branch: main
  base_url: https://api.netlify.com
  auth_endpoint: auth
  # Salvar no editor NÃO atualiza o site (o "[skip netlify]" evita gastar créditos a cada alteração).
  # O site é atualizado de uma vez pelo botão "Publicar site" na tabela do painel (/admin).
  commit_messages:
    create: "Nova peça: {{slug}} [skip netlify]"
    update: "Alteração: {{slug}} [skip netlify]"
    delete: "Exclusão: {{slug}} [skip netlify]"
    uploadMedia: "Foto enviada: {{path}} [skip netlify]"
    deleteMedia: "Foto removida: {{path}} [skip netlify]"

# Nomes de arquivo limpos (sem acento nem espaço) para fotos e fichas
slug:
  encoding: ascii
  clean_accents: true
  sanitize_replacement: "-"
locale: pt
media_folder: static/uploads
public_folder: /uploads
publish_mode: simple

collections:
  - name: pecas
    label: Peças do acervo
    label_singular: Peça
    folder: content/pecas
    media_folder: "/static/uploads/pecas/{{filename}}"   # uma pasta de fotos por peça
    public_folder: "/uploads/pecas/{{filename}}"
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{designer}}-{{titulo}}"
    summary: "{{codigo}} · {{titulo}} · {{designer}} · {{status}}"
    view_filters:
      - { label: "Disponíveis", field: status, pattern: "disponivel" }
      - { label: "Vendidas", field: status, pattern: "vendido" }
      - { label: "Ocultas", field: status, pattern: "oculto" }
      - { label: "Em destaque", field: destaque, pattern: true }
    view_groups:
      - { label: "Tipo de peça", field: categoria }
      - { label: "Designer", field: designer }
      - { label: "Situação", field: status }
    sortable_fields: ["codigo", "titulo", "designer", "data"]
    fields:
      - { name: titulo, label: Nome da peça, widget: string }
      - { name: designer, label: Designer ou fabricante, widget: string, hint: "Escreva igual às outras peças (ex.: Sérgio Rodrigues) para agrupar certo. Sem autoria conhecida: Anônimo (aparece no site como Autoria desconhecida)." }
      - { name: fabricante, label: Fabricante, widget: string, required: false, hint: "Só quando for diferente do designer (ex.: Hobjeto, L'Atelier, Novo Rumo). Não repita o nome do designer no Nome da peça." }
      - { name: ano, label: Ano ou década, widget: string, required: false, hint: "ex.: 1973 ou déc. 1960" }
      - name: categoria
        label: Tipo de peça
        widget: select
        options: ["Poltronas", "Cadeiras", "Sofás", "Mesas de centro", "Mesas laterais", "Mesas de jantar", "Bancos", "Aparadores/Buffet", "Escrivaninhas", "Iluminação", "Objetos"]
      - name: status
        label: Situação
        widget: select
        default: disponivel
        options:
          - { label: "Disponível", value: disponivel }
          - { label: "Vendido", value: vendido }
          - { label: "Oculto (não aparece no site)", value: oculto }
      - { name: preco, label: preco, widget: hidden, required: false }   # preço não aparece no site
      - { name: preco_obs, label: preco_obs, widget: hidden, required: false }   # preço não aparece no site
      - { name: parcelamento, label: parcelamento, widget: hidden, required: false }   # preço não aparece no site
      - { name: dimensoes, label: Dimensões, widget: string, required: false, hint: "ex.: L 86 × P 75 × A 70 cm" }
      - { name: materiais, label: Materiais, widget: string, required: false }
      - { name: descricao, label: Descrição, widget: text, required: false }
      - { name: estado, label: Estado de conservação, widget: string, required: false, hint: "ex.: Estrutura original com pátina natural. Vazio = não aparece." }
      - { name: procedencia, label: Procedência, widget: string, required: false, hint: "ex.: Coleção particular, São Paulo. Vazio = não aparece." }
      - { name: restauro_mantido, label: "Restauro: o que foi mantido", widget: string, required: false, hint: "Preenchendo qualquer campo de restauro, a ficha ganha o bloco Registro de restauro." }
      - { name: restauro_refeito, label: "Restauro: o que foi refeito", widget: string, required: false }
      - { name: restauro_oficina, label: "Restauro: oficina", widget: string, required: false }
      - { name: imagens, label: Fotos (a primeira é a capa), widget: fotos, required: false, hint: "Ordem importa: 1ª = foto grande de abertura (de preferência ambientada); 2ª e 3ª, 4ª e 5ª… ficam lado a lado (bons para detalhes); a última fica larga se sobrar sozinha. Peça sem foto não aparece no site." }
      - { name: data, label: Data de entrada no acervo, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, hint: "Define a ordem do acervo (mais recentes primeiro)." }
      - { name: codigo, label: Código interno (VLT), widget: string, required: false, hint: "Mais de uma unidade: separe por vírgula, ex.: VLT-032, VLT-033" }
      - { name: data_compra, label: Data da compra (uso interno, não aparece no site), widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, required: false }
      - { name: destaque, label: Mostrar na página inicial (reserva), widget: boolean, default: false, hint: "A home usa a Seleção do acervo, em Textos e contatos. Esta marcação só vale se a seleção estiver vazia." }
      - { name: ordem, label: Ordem no acervo, widget: number, value_type: int, default: 100, hint: "Números menores aparecem primeiro." }
      - { name: url_antiga, label: Endereço antigo (Artlogic), widget: hidden, required: false }
      - { name: categoria_antiga, label: Categoria antiga, widget: hidden, required: false }

  - name: config
    label: Textos e contatos
    editor: { preview: false }
    files:
      - name: site
        label: Configurações do site
        file: content/site.json
        format: json
        media_folder: "/static/uploads/home"   # fotos do carrossel e logo
        public_folder: "/uploads/home"
        fields:
          - name: capa
            label: Foto da capa da home
            widget: object
            collapsed: false
            hint: "Uma foto só, fixa. Troque por temporada. Horizontal, 2560 × 1440 px ou maior."
            fields:
              - { name: foto, label: Foto, widget: image }
              - { name: descricao_foto, label: "Descrição da foto (para Google e acessibilidade)", widget: string, required: false }
              - { name: credito, label: "Legenda / crédito (aparece embaixo da foto)", widget: string, required: false, hint: "ex.: Acervo Voluta, Belo Horizonte · Fotografia: Nome" }
          - name: manifesto
            label: Texto de abertura da home
            widget: object
            fields:
              - { name: sobretitulo, label: Sobretítulo, widget: string, required: false }
              - { name: titulo, label: Frase principal, widget: string }
              - { name: texto, label: Texto, widget: text, required: false }
          - name: selecao
            label: Seleção do acervo (home)
            label_singular: Peça da seleção
            widget: list
            max: 5
            summary: "{{fields.peca}}"
            hint: "Até 5 peças, nesta ordem: 1ª destaque grande (foto vertical), 2ª média ao lado (foto quadrada funciona bem), 3ª a 5ª na fileira de baixo. Só aparecem peças disponíveis. Peça vendida sai sozinha da home."
            fields:
              - { name: peca, label: Peça, widget: relation, collection: pecas, search_fields: [titulo, designer, codigo], value_field: "{{slug}}", display_fields: ["{{designer}} · {{titulo}}"], filters: [{ field: status, values: [disponivel] }] }
              - { name: foto_n, label: "Usar a foto nº (da ficha da peça)", widget: number, value_type: int, min: 1, default: 1, required: false, hint: "1 = capa da peça." }
              - { name: foto, label: "Ou enviar uma foto só para a home (opcional)", widget: image, required: false }
          - { name: restauro_resumo, label: "Faixa Restauro da home: texto", widget: text, required: false }
          - name: restauro_fotos
            label: "Faixa Restauro da home: fotos"
            label_singular: Foto
            widget: list
            max: 3
            hint: "3 fotos de detalhe ou bastidor. A 1ª fica larga em cima."
            fields:
              - { name: foto, label: Foto, widget: image }
              - { name: descricao_foto, label: "Descrição da foto", widget: string, required: false }
          - { name: fotos_capa, label: fotos_capa, widget: hidden, required: false }   # antigo, não usado
          - { name: galeria, label: galeria, widget: hidden, required: false }   # antigo, não usado
          - { name: nome, label: Nome, widget: string }
          - { name: url, label: Endereço do site, widget: string }
          - { name: descricao, label: Descrição para o Google, widget: text }
          - { name: cidade, label: Cidade, widget: string }
          - { name: whatsapp, label: "WhatsApp (só números, com 55)", widget: string }
          - { name: whatsapp_exibicao, label: WhatsApp como aparece no site, widget: string }
          - { name: email, label: E-mail, widget: string }
          - { name: instagram, label: Instagram (sem @), widget: string }
          - { name: logo, label: Logo, widget: image }
          - { name: imagem_sobre, label: Foto da página Sobre, widget: image }
          - { name: ga4_id, label: "Google Analytics (G-XXXX)", widget: string, required: false }
          - { name: meta_pixel_id, label: Pixel da Meta, widget: string, required: false }
          - name: categorias
            label: Tipos de peça (ordem do filtro e foto de cada categoria)
            label_singular: Tipo de peça
            widget: list
            summary: "{{fields.nome}}"
            fields:
              - { name: nome, label: Nome do tipo, widget: string, hint: "Tem que ser igual ao tipo escolhido nas fichas das peças." }
              - { name: foto, label: Foto da categoria, widget: image, required: false, hint: "Foto vertical, 1200 × 1600 px." }
          - name: designers
            label: Designers
            label_singular: Designer
            widget: list
            summary: "{{fields.nome}}"
            hint: "Com Bio preenchida, a página do designer ganha abertura com foto, texto e cronologia."
            fields:
              - { name: nome, label: Nome, widget: string, hint: "Igual ao campo Designer das peças." }
              - { name: info, label: "Nacionalidade e datas", widget: string, required: false }
              - { name: resumo, label: "Resumo (1 ou 2 frases)", widget: text, required: false }
              - { name: foto, label: "Foto de abertura (horizontal, larga)", widget: image, required: false }
              - { name: bio, label: Bio, widget: text, required: false, hint: "Parágrafos separados por uma linha em branco. Linha começando com ## vira intertítulo." }
              - { name: cronologia, label: Cronologia, label_singular: Data, widget: list, required: false, summary: "{{fields.ano}} · {{fields.fato}}", fields: [ { name: ano, label: Ano, widget: string }, { name: fato, label: Fato, widget: string } ] }
          - { name: sobre, label: Texto da página Sobre, widget: markdown }
          - { name: restauro, label: Texto da página Restauro, widget: markdown }
          - name: restauro_casos
            label: "Página Restauro: exemplos"
            label_singular: Exemplo
            widget: list
            summary: "{{fields.titulo}}"
            hint: "Cada exemplo aparece abaixo do texto da página Restauro. Coloque as fotos na ordem antes → depois."
            fields:
              - { name: titulo, label: "Peça", widget: string, hint: "Ex.: Poltrona MP-97, Percival Lafer" }
              - { name: texto, label: "O que foi feito", widget: text }
              - name: fotos
                label: Fotos
                label_singular: Foto
                widget: list
                required: false
                hint: "Até 4. Sugestão: 1ª = antes, última = depois."
                field: { name: foto, label: Foto, widget: image }
          - { name: devolucao, label: Política de devolução, widget: markdown }

  - name: exposicoes
    label: Exposições
    label_singular: Exposição
    folder: content/exposicoes
    media_folder: "/static/uploads/exposicoes/{{filename}}"
    public_folder: "/uploads/exposicoes/{{filename}}"
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{titulo}}"
    summary: "{{titulo}} · {{inicio}}"
    fields:
      - { name: titulo, label: Título, widget: string }
      - { name: subtitulo, label: Subtítulo, widget: string, required: false, hint: "ex.: O conjunto Novo Rumo" }
      - { name: inicio, label: Início, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { name: fim, label: Fim, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false, required: false, hint: "Depois desta data ela vai para Exposições anteriores." }
      - { name: destaque, label: Mostrar na home, widget: boolean, default: false, required: false, hint: "Sem nenhuma marcada, a home mostra a mais recente em cartaz." }
      - { name: capa, label: Foto de abertura, widget: image, hint: "A foto mais forte do conjunto, horizontal e grande." }
      - { name: resumo, label: "Resumo (1 ou 2 frases)", widget: text, required: false }
      - { name: texto, label: Texto curatorial, widget: text, hint: "3 a 5 parágrafos, separados por uma linha em branco. Linha começando com ## vira intertítulo." }
      - name: fotos
        label: Fotos editoriais
        label_singular: Foto
        widget: list
        required: false
        summary: "{{fields.legenda}}"
        hint: "Na ordem em que aparecem. Foto com legenda fica larga; duas seguidas sem legenda ficam lado a lado."
        fields:
          - { name: foto, label: Foto, widget: image }
          - { name: legenda, label: Legenda, widget: string, required: false }
      - name: pecas
        label: Peças da exposição
        label_singular: Peça
        widget: relation
        collection: pecas
        multiple: true
        required: false
        search_fields: [titulo, designer, codigo]
        value_field: "{{slug}}"
        display_fields: ["{{designer}} · {{titulo}}"]
      - { name: oculto, label: Ocultar do site, widget: boolean, default: false, required: false }

  - name: diario
    label: Diário
    label_singular: Ensaio
    folder: content/diario
    media_folder: "/static/uploads/diario/{{filename}}"
    public_folder: "/uploads/diario/{{filename}}"
    extension: json
    format: json
    create: true
    delete: true
    slug: "{{titulo}}"
    summary: "{{data}} · {{titulo}}"
    fields:
      - { name: titulo, label: Título, widget: string }
      - { name: categoria, label: Categoria, widget: select, options: [Designers, Fabricantes, Materiais, Colecionar, Bastidores], required: false }
      - { name: data, label: Data, widget: datetime, format: "YYYY-MM-DD", date_format: "DD/MM/YYYY", time_format: false }
      - { name: capa, label: Foto de capa, widget: image, required: false }
      - { name: resumo, label: "Resumo (1 frase, aparece no cartão)", widget: string, required: false }
      - { name: texto, label: Texto, widget: text, hint: "Parágrafos separados por uma linha em branco. Linha começando com ## vira intertítulo." }
      - name: fotos
        label: Fotos no fim do texto
        label_singular: Foto
        widget: list
        required: false
        fields:
          - { name: foto, label: Foto, widget: image }
          - { name: legenda, label: Legenda, widget: string, required: false }
      - name: pecas
        label: Peças citadas
        label_singular: Peça
        widget: relation
        collection: pecas
        multiple: true
        required: false
        search_fields: [titulo, designer, codigo]
        value_field: "{{slug}}"
        display_fields: ["{{designer}} · {{titulo}}"]
      - { name: oculto, label: Ocultar do site, widget: boolean, default: false, required: false }
